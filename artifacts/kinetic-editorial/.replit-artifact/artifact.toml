kind = "web"
previewPath = "/"
title = "Kinetic Editorial Magazine"
description = "A visual editorial magazine experience with kinetic scroll storytelling, immersive feature chapters, and responsive desktop-to-PWA presentation for curious readers."
version = "1.0.0"
id = "artifacts/kinetic-editorial"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23166

[services.development]
run = "pnpm --filter @workspace/kinetic-editorial run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kinetic-editorial", "run", "build" ]
serve = "static"
publicDir = "artifacts/kinetic-editorial/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23166"
BASE_PATH = "/"
